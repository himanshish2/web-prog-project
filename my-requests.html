<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Activity - CampusCarry</title>
    <meta name="description" content="Track your parcel requests and manage deliveries on CampusCarry.">
    <!-- h_style.css = shared navbar, footer, buttons, colours (must come first) -->
    <link rel="stylesheet" href="h_style.css">
    <!-- dashboard.css = signed-in app pages (cards, tabs, stepper, badges) -->
    <link rel="stylesheet" href="dashboard.css">
</head>
<body data-auth="required" class="appPage">

    <header id="siteHeader"></header>

    <main id="main" class="pageWrap">

        <a href="dashboard.html" class="backLink">&larr; Back to Dashboard</a>

        <div class="pageHead">
            <h1>My Activity</h1>
            <p>Track your requests and manage deliveries you've accepted.</p>
        </div>

        <!-- TABS
             "My Requests"    = requests the user posted (requester view)
             "I'm Delivering" = requests the user accepted (runner view) -->
        <div class="tabs" role="tablist">
            <button type="button" class="tabButton active" id="tabMy" role="tab"
                    aria-selected="true" aria-controls="panelMy">My Requests</button>
            <button type="button" class="tabButton" id="tabDelivering" role="tab"
                    aria-selected="false" aria-controls="panelDelivering">I'm Delivering</button>
        </div>

        <div class="tabPanel active" id="panelMy" role="tabpanel" aria-labelledby="tabMy">
            <div class="cardsGrid" id="myGrid"></div>
        </div>

        <div class="tabPanel" id="panelDelivering" role="tabpanel" aria-labelledby="tabDelivering">
            <div class="cardsGrid" id="deliverGrid"></div>
        </div>

    </main>

    <div id="siteFooter"></div>

    <script src="layout.js"></script>
    <script src="app.js"></script>
    <script src="my-requests.js"></script>
</body>
</html>
