<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - CampusCarry</title>
    <meta name="description" content="Admin view for order statistics and Excel export">
    <!-- h_style.css = shared navbar, footer, buttons, colours (must come first) -->
    <link rel="stylesheet" href="h_style.css">
    <!-- admin.css = this page only -->
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <header id="siteHeader"></header>

    <main id="main" class="pageWrap pageNarrow">

        <div class="pageHead">
            <h1>Admin Dashboard</h1>
            <p>Order statistics and Excel export. Needs the backend running at <code>http://localhost:3001</code>.</p>
        </div>

        <p class="adminMessage" id="adminMessage" role="status" aria-live="polite" hidden></p>

        <section class="adminSection">
            <h2>Order Statistics</h2>
            <div class="tableScroll">
                <table class="statsTable" id="statsTable">
                    <thead>
                        <tr><th>Metric</th><th>Count</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <button type="button" class="btnPrimary" id="downloadBtn">Download Excel Report</button>
        </section>

        <section class="adminSection">
            <h2>All Orders (raw JSON)</h2>
            <pre class="rawBox" id="ordersRaw"></pre>
        </section>

    </main>

    <div id="siteFooter"></div>

    <script src="layout.js"></script>
    <script src="admin.js"></script>
</body>
</html>
