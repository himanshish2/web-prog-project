<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CampusCarry</title>
    <!-- h_style.css = shared navbar, footer, buttons, colours (must come first) -->
    <link rel="stylesheet" href="h_style.css">
    <!-- login-style.css = this page only -->
    <link rel="stylesheet" href="login-style.css">
</head>
<body>
    <header id="siteHeader"></header>

    <!-- State controller for the Log In / Sign Up tabs (pure CSS).
         These radios must stay siblings placed BEFORE <main>. -->
    <input type="radio" name="authTab" id="tabLogin" class="tabRadio" checked>
    <input type="radio" name="authTab" id="tabSignup" class="tabRadio">

    <main id="main" class="loginWrapper">

        <div class="loginCard">

            <!-- Card top header arc -->
            <div class="cardHeaderArc">
                <div class="brandLogoRow">
                    <div class="logoIconCircle">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" aria-hidden="true">
                            <path d="M21 8L12 3L3 8V16L12 21L21 16V8Z"/>
                            <path d="M3 8L12 13L21 8"/>
                            <path d="M12 13V21"/>
                        </svg>
                    </div>
                    <h1 class="brandTitle">Campus<span class="goldDot">Carry</span></h1>
                </div>
            </div>

            <!-- Floating form box -->
            <div class="formBox">

                <!-- Tab switcher pills -->
                <div class="tabPillRow">
                    <label for="tabLogin" class="tabBtn">Log In</label>
                    <label for="tabSignup" class="tabBtn">Sign Up</label>
                </div>

                <form class="authForm" id="authForm" action="#" method="POST">

                    <div class="inputFieldGroup">
                        <input type="text" class="inputUnderline" placeholder="Enter email or username"
                               aria-label="Email or username" autocomplete="username" required>
                    </div>

                    <div class="inputFieldGroup">
                        <input type="password" class="inputUnderline" placeholder="Password"
                               aria-label="Password" autocomplete="current-password" required>
                    </div>

                    <!-- Only visible in the Sign Up tab -->
                    <div class="inputFieldGroup signupOnly">
                        <input type="password" class="inputUnderline" placeholder="Confirm Password"
                               aria-label="Confirm password" autocomplete="new-password">
                    </div>

                    <div class="forgotRow">
                        <a href="#" class="forgotLink">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btnPrimary submitBtn">Log In</button>
                </form>

                <div class="orDivider">OR</div>

                <div class="socialBtnRow">
                    <button type="button" class="socialBtn" title="Login with Google" aria-label="Login with Google">
                        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.29v3.15C3.26 21.3 7.31 24 12 24z"/>
                            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.29C.47 8.21 0 10.05 0 12s.47 3.79 1.29 5.42l3.99-3.15z"/>
                            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.58l3.99 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                        </svg>
                    </button>
                    <button type="button" class="socialBtn" title="Login with Facebook" aria-label="Login with Facebook">
                        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                            <rect width="24" height="24" rx="4" fill="#1877F2"/>
                            <path fill="#FFFFFF" d="M16.5 12H14v8h-3v-8H9.5V9.5H11V8c0-2.2 1.3-3.5 3.5-3.5h2v2.5h-1.2c-1 0-1.3.4-1.3 1.2v1.3h2.5L16.5 12z"/>
                        </svg>
                    </button>
                </div>

            </div>

        </div>

    </main>

    <div id="siteFooter"></div>

    <script src="layout.js"></script>
    <script src="app.js"></script>
    <script src="login.js"></script>
</body>
</html>
