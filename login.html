<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CampusCarry</title>
    <link rel="stylesheet" href="h_style.css">
    <link rel="stylesheet" href="login-style.css">
</head>
<body>
    <header id="siteHeader"></header>

    <!-- State controller for Log In vs Sign Up tabs (Pure CSS) -->
    <!-- Tab state now handled via direct navigation to signup.html -->

    <!-- ==================================================================
         2. MAIN LOGIN SECTION FOR LAPTOP SCREEN (FLEXBOX & POSITION)
         ================================================================== -->
    <main class="login-wrapper">

        <!-- Centered Laptop Login Card -->
        <div class="login-card">

            <!-- Card Top Header Arc (POSITION & FLEXBOX) -->
            <div class="card-header-arc">
                <div class="brand-logo-row">
                    <div class="logo-icon-circle">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5">
                            <path d="M21 8L12 3L3 8V16L12 21L21 16V8Z"/>
                            <path d="M3 8L12 13L21 8"/>
                            <path d="M12 13V21"/>
                        </svg>
                    </div>
                    <h1 class="brand-title">Campus<span class="gold-dot">Carry</span></h1>
                </div>
            </div>

            <!-- Floating Form Box (POSITION & BOX MODEL) -->
            <div class="form-box">

                <!-- Tab Switcher Pills (FLEXBOX) -->
                <div class="tab-pill-row">
                    <!-- Log In is the active tab on this page -->
                    <span class="tab-btn active-tab">Log In</span>
                    <!-- Sign Up goes to your teammate's page -->
                    <a href="signup.html" class="tab-btn" id="signupTabBtn">Sign Up</a>
                </div>

                <!-- Auth Form (FLEXBOX & BOX MODEL) -->
                <form class="auth-form" action="#" method="POST" onsubmit="return false;">
                    
                    <!-- Email / Username input -->
                    <div class="input-field-group">
                        <input type="text" class="input-underline" placeholder="Enter email or username" required>
                    </div>

                    <!-- Password input -->
                    <div class="input-field-group">
                        <input type="password" class="input-underline" placeholder="Password" required>
                    </div>

                    <!-- Confirm Password field is on signup.html (teammate's file) -->

                    <!-- Forgot Password Link -->
                    <div class="forgot-row">
                        <a href="#" class="forgot-link">Forgot Password?</a>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="submit-btn">Log In</button>
                </form>

                <!-- Social login removed — not needed for this project -->

            </div>

        </div>

    </main>
    <div id="siteFooter"></div>

    <script src="layout.js"></script>
</body>
</html>
