<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CampusCarry</title>
    <link rel="stylesheet" href="h_style.css">
    <link rel="stylesheet" href="login-style.css">
    <style>
        /* Custom New User Modal Styling */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(11, 14, 82, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-card {
            background-color: #FFFFFF;
            width: 90%;
            max-width: 420px;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            border: 2px solid #363B8B;
        }
        .modal-card h3 {
            color: #0B0E52;
            font-size: 20px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .modal-card p {
            color: #53677A;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .modal-btn-row {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .modal-btn {
            flex: 1;
            padding: 12px 18px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        .btn-continue {
            background-color: #363B8B;
            color: #FFFFFF;
        }
        .btn-nothanks {
            background-color: #E2E8F0;
            color: #0B0E52;
        }
    </style>
</head>
<body>
    <header id="siteHeader"></header>

    <input type="radio" name="auth-tab" id="tab-login" class="tab-radio" checked>
    <input type="radio" name="auth-tab" id="tab-signup" class="tab-radio">

    <main class="login-wrapper">

        <div class="login-card">

            <div class="card-header-arc">
                <div class="brand-logo-row">
                    <div class="logo-icon-circle">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5">
                            <path d="M21 8L12 3L3 8V16L12 21L21 16V8Z"/>
                            <path d="M3 8L12 13L21 8"/>
                            <path d="M12 13V21"/>
                        </svg>
                    </div>
                    <h1 class="brand-title">Campus<span class="gold-dot">Carry</span></h1>
                </div>
            </div>

            <div class="form-box">

                <div class="tab-pill-row">
                    <label for="tab-login" class="tab-btn" onclick="switchToLoginTab()">Log In</label>
                    <label for="tab-signup" class="tab-btn" onclick="openSignupModal(event)">Sign Up</label>
                </div>

                <form class="auth-form" id="loginForm" onsubmit="handleLoginSubmit(event)">
                    
                    <div class="input-field-group">
                        <input type="text" id="loginUserEmail" class="input-underline" placeholder="Enter email or username" required>
                    </div>

                    <div class="input-field-group">
                        <input type="password" id="loginPassword" class="input-underline" placeholder="Password" required>
                    </div>

                    <div class="forgot-row">
                        <a href="#" class="forgot-link">Forgot Password?</a>
                    </div>

                    <button type="submit" class="submit-btn">Log In</button>
                </form>

                <div class="or-divider">OR</div>

                <div class="social-btn-row">
                    <button class="social-btn" type="button" title="Login with Google">
                        <svg width="18" height="18" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                            <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.29v3.15C3.26 21.3 7.31 24 12 24z"/>
                            <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.29C.47 8.21 0 10.05 0 12s.47 3.79 1.29 5.42l3.99-3.15z"/>
                            <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.58l3.99 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                        </svg>
                    </button>
                    <button class="social-btn" type="button" title="Login with Facebook">
                        <svg width="18" height="18" viewBox="0 0 24 24">
                            <rect width="24" height="24" rx="4" fill="#1877F2"/>
                            <path fill="#FFFFFF" d="M16.5 12H14v8h-3v-8H9.5V9.5H11V8c0-2.2 1.3-3.5 3.5-3.5h2v2.5h-1.2c-1 0-1.3.4-1.3 1.2v1.3h2.5L16.5 12z"/>
                        </svg>
                    </button>
                </div>

            </div>

        </div>

    </main>

    <!-- NEW USER POPUP MODAL -->
    <div class="modal-overlay" id="newUserModal">
        <div class="modal-card">
            <h3>CONFIRM REGISTRATION OF NEW ACCOUNT</h3>
            <p>Would you like to register a new CampusCarry profile and set up your student credentials?</p>
            <div class="modal-btn-row">
                <button type="button" class="modal-btn btn-nothanks" onclick="closeModal()">NO THANKS</button>
                <button type="button" class="modal-btn btn-continue" onclick="proceedToSignup()">CONTINUE</button>
            </div>
        </div>
    </div>

    <div id="siteFooter"></div>

    <script>
        function openSignupModal(event) {
            if (event) event.preventDefault();
            document.getElementById("tab-login").checked = true;
            document.getElementById("newUserModal").style.display = "flex";
        }

        function switchToLoginTab() {
            document.getElementById("tab-login").checked = true;
        }

        function closeModal() {
            document.getElementById("newUserModal").style.display = "none";
            document.getElementById("tab-login").checked = true;
        }

        function proceedToSignup() {
            window.location.href = "b_signup.html";
        }

        function handleLoginSubmit(event) {
            event.preventDefault();
            const inputVal = document.getElementById("loginUserEmail").value.trim().toLowerCase();

            const savedProfile = JSON.parse(localStorage.getItem("studentProfile"));

            // Check if user exists in localStorage
            if (!savedProfile || (savedProfile.bmuEmail.toLowerCase() !== inputVal && savedProfile.studentName.toLowerCase() !== inputVal && savedProfile.enrollmentNo !== inputVal)) {
                // User is NEW -> Show Pop-up Modal
                openSignupModal();
            } else {
                // User EXISTS -> Redirect to Profile
                alert(`Welcome back, ${savedProfile.studentName}!`);
                window.location.href = "b_profile.html";
            }
        }
    </script>
    <script src="layout.js"></script>
</body>
</html>
