<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Requests - CampusCarry</title>
    <!-- h_style.css = shared navbar, footer, buttons, colours (must come first) -->
    <link rel="stylesheet" href="h_style.css">
    <!-- dashboard.css = signed-in app pages (dashboard, browse requests) -->
    <link rel="stylesheet" href="dashboard.css">
</head>
<body data-auth="required" class="appPage">

    <header id="siteHeader"></header>

    <main id="main" class="pageWrap">

        <a href="dashboard.html" class="backLink">&larr; Back to Dashboard</a>

        <div class="pageHead">
            <h1>Available Requests</h1>
            <p>Pick a delivery that fits your route, accept it and earn the reward.</p>
        </div>

        <!-- Filter buttons (urgency) + search box. Cards are filtered by available-requests.js -->
        <div class="filterBar">
            <button type="button" class="filterBtn active" data-filter="all">All Requests</button>
            <button type="button" class="filterBtn" data-filter="urgent">Urgent Only 🔴</button>
            <input class="filterSearch" type="text" id="searchInput"
                   placeholder="Search item, pickup, or drop-off…" aria-label="Search requests">
        </div>

        <p class="reqCount" id="reqCount" role="status" aria-live="polite">Loading…</p>

        <!-- Cards are injected here by available-requests.js -->
        <div class="cardsGrid" id="cardsGrid"></div>

    </main>

    <!-- ACCEPT MODAL: asks for confirmation before the request is saved as accepted -->
    <div class="modalOverlay" id="modal">
        <div class="modalBox" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <h3 id="modalTitle">Accept this request?</h3>
            <p>
                You'll be responsible for collecting the parcel and delivering it
                to the requester. They'll be able to track the status in real time.
            </p>
            <div class="modalActions">
                <button type="button" class="btnSecondary" id="cancelAccept">Cancel</button>
                <button type="button" class="btnPrimary" id="confirmAccept">Yes, Accept</button>
            </div>
        </div>
    </div>

    <div id="siteFooter"></div>

    <script src="layout.js"></script>
    <script src="app.js"></script>
    <script src="available-requests.js"></script>
</body>
</html>
